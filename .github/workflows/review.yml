# The review as a reusable workflow: the job around action.yml, so a repository's workflow only
# sets the triggers and permissions and passes its secrets with `secrets: inherit`. A change to the
# runner, timeout, concurrency or which secrets the review uses is made here, not in every
# repository. See Usage in the README.
#
# The action is called at master, not ./: in a called workflow ./ is the calling repository's
# checkout. So pinning this file to a commit doesn't pin the action. A repository that needs a
# strict pin calls the action by SHA instead (see Pinning the logic in the README).
#
# Permissions aren't set here: the calling workflow's are the most the job gets, and a repository
# chooses contents: read or write (see Resolving or minimising earlier findings).

name: Claude Code Review

on:
  workflow_call:
    # Defaults match action.yml's: keep them in step.
    inputs:
      model:
        description: The model that reviews. A single model ID.
        type: string
        required: false
        default: claude-opus-5-5
      max-findings:
        description: >-
          The most new findings a review posts. Empty for the rules' default.
        type: string
        required: false
        default: ''
      rules-ref:
        description: >-
          The commit of redbubble/claude-code-reviews-rules to review with: master, or a full
          40-character commit SHA from it.
        type: string
        required: false
        default: master
    # With `secrets: inherit` these come from the calling repository without being listed. They're
    # declared so a repository can also pass them one by one.
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      REVIEW_APP_PRIVATE_KEY:
        required: false
      ATLASSIAN_CLIENT_SECRET:
        required: false
      DATADOG_API_KEY:
        required: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: redbubble/claude-code-reviews@master
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          app-private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
          atlassian-client-secret: ${{ secrets.ATLASSIAN_CLIENT_SECRET }}
          datadog-api-key: ${{ secrets.DATADOG_API_KEY }}
          model: ${{ inputs.model }}
          max-findings: ${{ inputs.max-findings }}
          rules-ref: ${{ inputs.rules-ref }}

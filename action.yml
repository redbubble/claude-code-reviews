name: Claude Code Review
description: Reviews a pull request with Claude Code, against Articore's review rules.
author: Articore

# The calling job sets the triggers, permissions, timeout and concurrency: a composite action
# can't. See the README for the workflow to copy. Rules come from the private
# redbubble/claude-code-reviews-rules at run time, the helpers in bin/ from this action.
#
# Every action used here gets this repository's secrets, so each is pinned to a full commit SHA,
# with its version alongside: a moved tag can't change the code they run with, and a consumer that
# pins this action pins them too. Dependabot proposes updates (.github/dependabot.yml). Before
# merging one for claude-code-action, check the tools tag mode adds against --disallowedTools
# below.

inputs:
  anthropic-api-key:
    description: Anthropic API key.
    required: true
  app-private-key:
    description: >-
      Private key of the review GitHub App (claude-code-review-org-reader), for read-only tokens
      to the rules and to other repositories.
    required: true
  atlassian-client-secret:
    description: >-
      Client secret of the Atlassian service account's OAuth credential. Without it, the review
      doesn't read Jira or Confluence.
    required: false
    default: ''
  model:
    description: The model that reviews. A single model ID.
    required: false
    default: claude-opus-5-5
  max-findings:
    description: >-
      The most new findings a review posts, of every severity, Important included. Without it,
      the rules' default applies: 5, with every Important finding posted even past it. Rules
      versions up to v0.14 ignore it.
    required: false
    default: ''
  rules-ref:
    description: >-
      The commit of redbubble/claude-code-reviews-rules to review with: master, or a full
      40-character commit SHA from it.
    required: false
    default: master
  github-token:
    description: The token the review is posted with.
    required: false
    default: ${{ github.token }}
  datadog-api-key:
    description: >-
      Datadog API key, to send the run's metrics: count, time, cost and tokens. Without it, no
      metrics are sent. It never reaches Claude.
    required: false
    default: ''
  review-dependabot:
    description: >-
      true to review pull requests Dependabot opens, which are skipped by default. Dependabot's
      runs only get the secrets added under Dependabot, so add the review's there too. A run from
      the review label being added reviews them either way.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # When the job started, for the metrics at the end. The runner starts a Runner.Worker process
    # for each job, before "Set up job", so its age gives the start the jobs API would, without
    # the actions: read permission. If it can't be found, the time this step starts instead, a
    # few seconds late.
    - id: start
      shell: bash
      run: |
        now=$(date +%s)
        pid=$$
        age=
        while [ -n "$pid" ] && [ "$pid" -gt 1 ]; do
          if [ "$(ps -o comm= -p "$pid" 2> /dev/null)" = Runner.Worker ]; then
            age=$(ps -o etimes= -p "$pid" 2> /dev/null | tr -d ' ')
            break
          fi
          pid=$(ps -o ppid= -p "$pid" 2> /dev/null | tr -d ' ')
        done
        if [[ $age =~ ^[0-9]+$ ]]; then
          echo "epoch=$((now - age))" >> "$GITHUB_OUTPUT"
        else
          echo "epoch=$now" >> "$GITHUB_OUTPUT"
        fi

    # Whether to review: not a draft, not opened by Dependabot (unless review-dependabot is true), and
    # not a PR that only holds a decision record, from a branch named adr-<epoch>-... into the default
    # branch, changing nothing outside docs/adr/. Those are discussed on the PR instead (see
    # docs/adr/1792646959-record-architecture-decisions.md in redbubble/claude-code-reviews-rules). A
    # draft is reviewed when the run comes from a label being added: someone asked for it, and so is a
    # Dependabot PR. Skipped steps leave the job passing, so a required check is satisfied. The draft
    # state, visibility and changed files are read from GitHub when the step runs, never from the
    # event: a re-run replays the event as it was when the run was created, so a run from while the PR
    # was a draft would otherwise skip again after it's marked ready. The author is read with them,
    # for the metrics' author_type and bot tags. A decision-record skip also says why in one PR
    # comment, updated rather than repeated; a draft doesn't, as it's reviewed once it's ready, and
    # nor does a Dependabot PR, as the skip is the repository's choice. A public repository fails the
    # job instead, before any token is made: the review reads private repositories, Jira and
    # Confluence, and anyone could read what it posts there.
    - id: scope
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        EVENT_ACTION: ${{ github.event.action }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
        REVIEW_DEPENDABOT: ${{ inputs.review-dependabot }}
      run: |
        if [ -z "$PR" ]; then
          echo "::error::The review only runs on pull_request events"
          exit 1
        fi
        # Fail on a typo rather than review, or skip, what the repository didn't choose.
        if ! [[ $REVIEW_DEPENDABOT =~ ^(true|false)$ ]]; then
          echo "::error::review-dependabot isn't true or false"
          exit 1
        fi
        # If either can't be read, fail rather than skip: a skip passes the check.
        repo_state=$(gh api "repos/$GITHUB_REPOSITORY" --jq '"\(.private) \(.default_branch)"') || {
          echo "::error::Couldn't read whether $GITHUB_REPOSITORY is private"
          exit 1
        }
        private=${repo_state%% *}
        default_branch=${repo_state#* }
        if [ "$private" != true ]; then
          echo "::error::The review only runs in private repositories: it reads private code, Jira and Confluence, and posts what it finds on the pull request"
          exit 1
        fi
        pr_state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" \
          --jq '"\(.draft) \(.changed_files) \(.base.ref) \(.user.type) \(.user.login)"') || {
          echo "::error::Couldn't read pull request #$PR"
          exit 1
        }
        read -r draft changed_files base_ref author_type author <<<"$pr_state"
        # For the metrics: bot or human, and which bot, without the [bot] suffix. A human's login
        # isn't sent: it would put a name on the cost, and add a tag value per person.
        if [ "$author_type" = Bot ]; then
          echo author_type=bot >> "$GITHUB_OUTPUT"
          bot=${author%\[bot\]}
          [[ $bot =~ ^[A-Za-z0-9-]+$ ]] && echo "bot=$bot" >> "$GITHUB_OUTPUT"
        else
          echo author_type=human >> "$GITHUB_OUTPUT"
        fi

        marker='<!-- claude-code-review-skipped -->'
        comments="repos/$GITHUB_REPOSITORY/issues/$PR/comments"
        # The comment is only a pointer: failing to post it never fails the job. Only a Claude
        # reviewer's own comment counts, so a PR author can't post the marker and have it edited.
        # sed rather than head, which would stop gh mid-page and fail the pipe.
        skip_comment_id() {
          gh api "$comments" --paginate --jq ".[] | select(.user.login == \"github-actions[bot]\" or .user.login == \"claude[bot]\") | select(.body | startswith(\"$marker\")) | .id" | sed -n 1p
        }
        skip_with_comment() {
          echo "::notice::$1"
          echo run=false >> "$GITHUB_OUTPUT"
          echo skip=adr >> "$GITHUB_OUTPUT"
          body="$marker
        Claude Code Review skipped: $1"
          id=$(skip_comment_id) || id=
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "$comments" -f body="$body" > /dev/null
          fi || echo "::warning::Couldn't comment on the pull request about the skip"
          exit 0
        }

        if [ "$draft" = true ] && [ "$EVENT_ACTION" != labeled ]; then
          echo "::notice::Draft pull request: reviewed once it's marked ready, or when the review label is added"
          echo run=false >> "$GITHUB_OUTPUT"
          echo skip=draft >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ "$author" = 'dependabot[bot]' ] && [ "$REVIEW_DEPENDABOT" != true ] && [ "$EVENT_ACTION" != labeled ]; then
          echo "::notice::Opened by Dependabot: reviewed when the review label is added, or always with review-dependabot: true"
          echo run=false >> "$GITHUB_OUTPUT"
          echo skip=dependabot >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # Only against the default branch: against a branch the author pushed, an ADR-only diff
        # could hide other changes that a later change of base brings in.
        if [[ $HEAD_REF == adr-* ]] && [ "$base_ref" = "$default_branch" ]; then
          # Current and previous names, so moving a file into docs/adr/ doesn't count as ADR-only.
          # One file per line, as tab-separated names: @tsv escapes a tab or newline in a name. The
          # list stops at 3000 files, so it only counts when it has every file the PR changes. If
          # it can't be read, or is short, review as usual rather than skip.
          rows=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate \
            --jq '.[] | [.filename, (.previous_filename // "")] | @tsv') || rows=
          listed=$(grep -c . <<<"$rows") || listed=0
          names=$(tr '\t' '\n' <<<"$rows" | sed '/^$/d')
          if [ "$listed" -gt 0 ] && [ "$listed" = "$changed_files" ] && ! grep -qv '^docs/adr/' <<<"$names"; then
            skip_with_comment "only changes docs/adr/. Decision records are discussed on the pull request, not reviewed."
          fi
        fi

        echo run=true >> "$GITHUB_OUTPUT"

    - if: steps.scope.outputs.run == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1

    # Read-only tokens from the review GitHub App, one per organisation. The app is identified by its
    # client ID (not secret), which create-github-app-token prefers to the deprecated app ID.
    - id: rb-token
      if: steps.scope.outputs.run == 'true'
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: Iv23lituGw4b66z7qu3p
        private-key: ${{ inputs.app-private-key }}
        owner: redbubble
    - id: tp-token
      if: steps.scope.outputs.run == 'true'
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: Iv23lituGw4b66z7qu3p
        private-key: ${{ inputs.app-private-key }}
        owner: teepublic

    # The review rules. Checked out after the PR, so they replace anything the PR puts at this path.
    - if: steps.scope.outputs.run == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: redbubble/claude-code-reviews-rules
        ref: ${{ inputs.rules-ref }}
        token: ${{ steps.rb-token.outputs.token }}
        path: .claude-code-reviews
        fetch-depth: 1
        persist-credentials: false

    # Rules versions up to v0.11 keep the rules in review/, later ones at the root. Older rules
    # versions still work: their own review/bin/ isn't used, this action's bin/ is.
    - id: rules
      if: steps.scope.outputs.run == 'true'
      shell: bash
      env:
        RULES_REF: ${{ inputs.rules-ref }}
      run: |
        dir=.claude-code-reviews
        [ -f "$dir/review/RULES.md" ] && dir=$dir/review
        if [ ! -f "$dir/RULES.md" ]; then
          echo "::error::No RULES.md in redbubble/claude-code-reviews-rules at $RULES_REF"
          exit 1
        fi
        echo "dir=$dir" >> "$GITHUB_OUTPUT"
        echo "$GITHUB_ACTION_PATH/bin" >> "$GITHUB_PATH"

    # A 1-hour Jira and Confluence token for atlassian-read, from the review service account's
    # OAuth credential: its client ID (not secret) and the atlassian-client-secret input. Only this
    # token reaches Claude, never the client secret. Without the secret, or if Atlassian refuses
    # the credential, the review runs without Jira and Confluence and says so.
    - id: atlassian-token
      if: steps.scope.outputs.run == 'true'
      shell: bash
      env:
        CLIENT_ID: 0OgW3FpAlOuT12j1bTZqvxl3WgEtnRYN
        CLIENT_SECRET: ${{ inputs.atlassian-client-secret }}
      run: |
        if [ -z "$CLIENT_SECRET" ]; then
          echo "::notice::No atlassian-client-secret: the review won't read Jira or Confluence"
          exit 0
        fi
        # The secret goes to curl on stdin, so it isn't in the process list.
        token=$(printf '%s' "$CLIENT_SECRET" | curl -fsS --max-time 20 https://auth.atlassian.com/oauth/token \
          --data-urlencode grant_type=client_credentials --data-urlencode "client_id=$CLIENT_ID" \
          --data-urlencode client_secret@- | jq -r '.access_token // empty') || token=
        if [ -z "$token" ]; then
          echo "::warning::Atlassian refused the OAuth credential: the review won't read Jira or Confluence"
          exit 0
        fi
        echo "::add-mask::$token"
        echo "token=$token" >> "$GITHUB_OUTPUT"

    # The model goes into claude_args, which the action splits shell-style, so a value with spaces
    # would add flags such as --allowedTools. Allow a single model ID only. max-findings goes into
    # the prompt, so allow a number only.
    - if: steps.scope.outputs.run == 'true'
      shell: bash
      env:
        MODEL: ${{ inputs.model }}
        MAX_FINDINGS: ${{ inputs.max-findings }}
      run: |
        re='^[A-Za-z0-9][][A-Za-z0-9._:/@-]*$'
        [[ $MODEL =~ $re ]] || { echo "::error::model isn't a single model ID"; exit 1; }
        if [ -n "$MAX_FINDINGS" ] && ! [[ $MAX_FINDINGS =~ ^[1-9][0-9]{0,2}$ ]]; then
          echo "::error::max-findings isn't a number from 1 to 999"
          exit 1
        fi

    # The review is posted with github-token. Keep Claude's allowed tools unable to write files or
    # push (git log, git diff and git show write files with --output). track_progress puts the
    # action in tag mode, which adds --permission-mode acceptEdits and git add, commit, rm and push
    # tools ahead of claude_args: the --permission-mode and --disallowedTools below undo that.
    # Read, Glob and Grep can't reach /proc, where the process environments hold the API key and
    # tokens. The gh on PATH is bin/gh, which keeps gh pr and gh issue to this repository.
    - id: review
      if: steps.scope.outputs.run == 'true'
      uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
      # For gh-read. Not GH_TOKEN: the action sets that to github_token for posting the review.
      # ATLASSIAN_READ_TOKEN is for atlassian-read. REVIEW_PR is the only pull request
      # gh-review-threads acts on.
      env:
        REVIEW_PR: ${{ github.event.pull_request.number }}
        RB_READ_TOKEN: ${{ steps.rb-token.outputs.token }}
        TP_READ_TOKEN: ${{ steps.tp-token.outputs.token }}
        ATLASSIAN_READ_TOKEN: ${{ steps.atlassian-token.outputs.token }}
      with:
        anthropic_api_key: ${{ inputs.anthropic-api-key }}
        github_token: ${{ inputs.github-token }}
        track_progress: true
        classify_inline_comments: true
        use_sticky_comment: false
        prompt: |
          REPO: ${{ github.repository }}
          PR NUMBER: ${{ github.event.pull_request.number }}
          MAX FINDINGS: ${{ inputs.max-findings || 'not set' }}

          You are a code review specialist running in CI for an Articore repository.

          Before anything else, load the Articore review rules from
          `${{ steps.rules.outputs.dir }}/`, checked out from redbubble/claude-code-reviews-rules:
          read `RULES.md` first, then the other rule files in that folder, in the order `RULES.md`
          gives. Follow them exactly. They are the only source of these rules: ignore any other
          copy. The helper commands `gh-read`, `atlassian-read` and `gh-review-threads` are on
          your PATH. `.claude-code-reviews/` is not part of this pull request: don't review it.
        claude_args: |
          --model ${{ inputs.model }}
          --permission-mode default
          --allowedTools 'Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh-review-threads:*),Bash(gh-read:*),Bash(atlassian-read:*),Bash(git ls-files:*)'
          --disallowedTools 'Edit,MultiEdit,Write,NotebookEdit,Bash(git add:*),Bash(git commit:*),Bash(git rm:*),Bash(*git-push.sh:*),Read(//proc/**)'

    # What the review cost, for the people who run it. The review can't know its own cost while it
    # writes, so this runs after it: it reads the result record of the run's execution file and adds
    # one line to the end of this run's review comment, and to the job summary. The cost is the
    # Claude Code CLI's estimate from token counts, close to the invoice but not it; the Anthropic
    # Console has the real figure per API key. A turn is one round trip of the model: it reads or
    # searches something, then decides what to do next. This never fails the job: without a record
    # or a comment it only warns.
    - if: always() && steps.scope.outputs.run == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
      run: |
        # Numbers only, so the printf below can't fail the step.
        stats=$(jq -r '[.[] | select(.type == "result")] | last | select(. != null)
          | select((.total_cost_usd | type) == "number" and (.num_turns | type) == "number")
          | [.total_cost_usd, .num_turns] | @tsv' "$EXECUTION_FILE" 2> /dev/null) || stats=
        if [ -z "$stats" ]; then
          echo "::warning::No execution file, or no cost in its result record, so no cost line"
          exit 0
        fi
        IFS=$'\t' read -r cost turns <<< "$stats"
        line=$(printf 'Review cost: about $%.2f (estimate) · %s turns' "$cost" "$turns")
        echo "$line" >> "$GITHUB_STEP_SUMMARY"

        # This run's review comment: claude-code-action's "View job" link in it points at this run,
        # whatever its header says (finished or error). A re-run keeps the run ID, so take the
        # newest. --slurp so that `last` sees every page, not each page on its own. The marker,
        # not the line's text, says the line is already there: a review can quote "Review cost:".
        marker='<!-- claude-code-review-cost -->'
        run_link="($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
        found=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments?per_page=100" --paginate --slurp \
          | jq -c --arg link "$run_link" 'add
              | map(select(.user.login == "github-actions[bot]" or .user.login == "claude[bot]")
                | select(.body | contains($link)))
              | last | select(. != null) | {id, body}') || found=
        if [ -z "$found" ]; then
          echo "::notice::No review comment from this run to add the cost line to"
          exit 0
        fi
        id=$(jq -r .id <<< "$found")
        body=$(jq -r .body <<< "$found")
        if [[ "$body" == *"$marker"* ]]; then
          echo "::notice::The review comment already has a cost line"
          exit 0
        fi
        printf '%s\n\n%s\n<sub>%s</sub>' "$body" "$marker" "$line" > "$RUNNER_TEMP/review-comment.md"
        gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$RUNNER_TEMP/review-comment.md" > /dev/null \
          || echo "::warning::Couldn't add the cost line to the review comment"

    # The run's metrics, to Datadog (US1, api.datadoghq.com), when there's an API key. Last, so
    # the total includes every step; the post-job cleanup after it isn't included. Skips (drafts, Dependabot PRs and
    # decision records) send the run and its time only: no zeros for Claude. Tags: repo, outcome,
    # trigger (auto, label for a run from a label being added, rerun for a re-run), model, and,
    # once the pull request has been read, author_type (bot or human) and bot (which one). The cost is the same estimate
    # as the cost line. The key only goes to this step, and to curl on stdin, so it isn't in the
    # process list. This never fails the job.
    - if: always() && inputs.datadog-api-key != ''
      shell: bash
      env:
        DD_API_KEY: ${{ inputs.datadog-api-key }}
        JOB_START: ${{ steps.start.outputs.epoch }}
        RUN: ${{ steps.scope.outputs.run }}
        SKIP: ${{ steps.scope.outputs.skip }}
        AUTHOR_TYPE: ${{ steps.scope.outputs.author_type }}
        BOT: ${{ steps.scope.outputs.bot }}
        REVIEW_OUTCOME: ${{ steps.review.outcome }}
        EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        EVENT_ACTION: ${{ github.event.action }}
        MODEL: ${{ inputs.model }}
      run: |
        if ! [[ $DD_API_KEY =~ ^[A-Za-z0-9]+$ ]]; then
          echo "::warning::datadog-api-key isn't a Datadog API key, so no metrics were sent"
          exit 0
        fi

        now=$(date +%s)
        [[ $JOB_START =~ ^[0-9]+$ ]] || JOB_START=$now
        total=$((now - JOB_START))
        # GitHub bills each job in whole minutes, rounded up. The job ends after this step: the
        # post-job cleanup takes 2-4 seconds more, so add 3. Off by a minute at most, for a job
        # that ends within a few seconds of a minute.
        billed=$(((total + 3 + 59) / 60))

        # not_started: the review never ran, as an earlier step failed or the run was cancelled.
        if [ "$RUN" = false ]; then
          outcome=skipped_${SKIP:-other}
        elif [ "$RUN" = true ] && [[ $REVIEW_OUTCOME =~ ^(success|failure|cancelled)$ ]]; then
          outcome=$REVIEW_OUTCOME
        else
          outcome=not_started
        fi
        if [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]; then
          trigger=rerun
        elif [ "$EVENT_ACTION" = labeled ]; then
          trigger=label
        else
          trigger=auto
        fi

        stats=
        if [ "$RUN" = true ] && [ -n "$EXECUTION_FILE" ]; then
          stats=$(jq -c '[.[] | select(.type == "result")] | last | select(. != null)
            | {cost: .total_cost_usd, ms: .duration_ms, usage: (.usage // {})}' "$EXECUTION_FILE" 2> /dev/null) || stats=
        fi

        tags=$(jq -nc --arg repo "$GITHUB_REPOSITORY" --arg outcome "$outcome" --arg trigger "$trigger" --arg model "$MODEL" \
          --arg author_type "$AUTHOR_TYPE" --arg bot "$BOT" \
          '["repo:\($repo)", "outcome:\($outcome)", "trigger:\($trigger)", "model:\($model)"]
            + if $author_type == "" then [] else ["author_type:\($author_type)"] end
            + if $bot == "" then [] else ["bot:\($bot)"] end')
        args=(--arg p github.actions.claude_review --argjson ts "$now" --argjson total "$total" --argjson billed "$billed"
          --argjson tags "$tags" --argjson stats "${stats:-null}")
        # Counts: the run, its billed minutes, and its tokens by type. Summed across runs.
        series=$(jq -nc "${args[@]}" '
          def count($name; $v; $t): {metric: "\($p).\($name)", type: 1, points: [{timestamp: $ts, value: $v}], tags: $t};
          {series: ([count("runs"; 1; $tags), count("billed_minutes"; $billed; $tags)] + if $stats == null then [] else
            [["input", $stats.usage.input_tokens], ["output", $stats.usage.output_tokens],
             ["cache_write", $stats.usage.cache_creation_input_tokens], ["cache_read", $stats.usage.cache_read_input_tokens]]
            | map(select(.[1] | type == "number") | count("tokens"; .[1]; $tags + ["token_type:\(.[0])"])) end)}')
        # Distributions: per-run values, for sum, count, average and max. Times in seconds.
        dists=$(jq -nc "${args[@]}" '
          def dist($name; $v): {metric: "\($p).\($name)", points: [[$ts, [$v]]], tags: $tags};
          {series: ([dist("duration.total"; $total)] + if $stats == null then [] else
            [(select($stats.ms | type == "number") | dist("duration.claude"; $stats.ms / 1000)),
             (select($stats.cost | type == "number") | dist("cost_usd"; $stats.cost))] end)}')

        send() {
          printf 'header = "DD-API-KEY: %s"\n' "$DD_API_KEY" \
            | curl -fsS --max-time 20 --config - -H 'Content-Type: application/json' \
              --data-binary "$2" "https://api.datadoghq.com$1" > /dev/null
        }
        send /api/v2/series "$series" || echo "::warning::Couldn't send the run count and tokens to Datadog"
        send /api/v1/distribution_points "$dists" || echo "::warning::Couldn't send the run's time and cost to Datadog"
        echo "::notice::Metrics for Datadog: $outcome, $trigger, ${total}s in all"
